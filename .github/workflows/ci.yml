name: CI

# PR 与 master 推送时运行：Python 语法 / 导入冒烟 + 安卓单元测试。
#
# 背景：release.yml 只在推 v* tag 或手动触发时运行，因此依赖升级类 PR
# （Dependabot 每天会开一批）此前没有任何检查信号，只能靠人工判断能不能合。
# 这个工作流补上那个信号。

on:
  pull_request:
  push:
    branches: [master]

# 同一分支的新推送取消上一次仍在跑的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.6'

jobs:
  python:
    name: Python 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q qtui.py src utils

      - name: 导入冒烟（不依赖图形界面）
        run: |
          python - <<'PY'
          # 这些模块不依赖 Qt，覆盖了上传、数据生成、路线预览与登录等核心逻辑
          import src.config
          import src.data_generator
          import src.api_client
          import src.route_preview
          import src.login
          import src.main
          import utils.auxiliary_util

          print("core imports OK, version =", src.config.global_version)
          PY

      - name: 安装 Qt 运行库
        # runner 默认没有这些库，PySide6 加载 QtCore 时会报
        # ImportError: libEGL.so.1: cannot open shared object file
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0

      - name: 界面模块导入（offscreen）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # qtui 有 __main__ 守卫，导入不会真正开窗；
          # 这一步能抓到 PySide6 API 变动与 assets/resources_rc 缺失
          python -c "import qtui; print('qtui import OK')"

  android:
    name: 安卓构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 单元测试
        # assembleDebugAndroidTest 一并执行：它才会拉取并编译 androidTest 依赖
        # （androidx.test.ext:junit、espresso-core 等）。只跑 testDebugUnitTest
        # 的话，androidTest 依赖升级出问题在 CI 上完全看不出来。
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebugAndroidTest \
            -Dorg.gradle.java.home="$JAVA_HOME"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
