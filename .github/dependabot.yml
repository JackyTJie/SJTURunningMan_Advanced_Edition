version: 2
updates:
  # 桌面版 Python 依赖（requirements.txt）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 四个包互相牵连（requests 依赖 urllib3，tenacity 常与 requests 同版本演进），
      # 拆成四个 PR 反而要逐个试构建，合并成一个
      python-deps:
        patterns: ["*"]

  # 发布与 CI 流水线里的 GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["actions/*", "softprops/*", "gradle/*", "android-actions/*"]

  # 安卓 Gradle 依赖（版本目录在 gradle/libs.versions.toml）
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(android)"
    groups:
      # Compose 全家桶必须同进同出：BOM 与各 androidx 模块版本互相约束，
      # 单独升一个基本必然构建失败
      androidx:
        patterns: ["androidx.*", "com.google.android.*"]
      # Kotlin 编译器插件与 kotlin.plugin.compose 共用同一个版本号，
      # 必须一起升，否则 Compose 编译器版本对不上
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
      kotlinx:
        patterns: ["org.jetbrains.kotlinx*"]
      other:
        patterns: ["*"]
        exclude-patterns:
          - "androidx.*"
          - "com.google.android.*"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # Compose BOM 2026.09 对应 Compose 1.12.1，要求 compileSdk >= 37，
      # 而工程当前是 34。升级它必须先做平台级升级（装 android-37 SDK、
      # 评估 targetSdk 变更），在此之前每周重开 PR 没有意义。
      # 解除条件：compileSdk 升到 37 之后删掉这条。
      - dependency-name: "androidx.compose:compose-bom"

      # OkHttp 5.x 是跨大版本（4.12 -> 5.5），虽然当前用到的 API 面很小，
      # 但仍需人工适配 + 真机验证。等专门做网络栈升级时再放开。
      # 注：com.squareup.okhttp3:okhttp-urlconnection 全仓零引用，是多余的
      #     依赖，下次动这块时应一并删除。
      - dependency-name: "com.squareup.okhttp3:*"
        versions: ["5.x"]

# 说明：鸿蒙使用 oh-package.json5 + ohpm，不属于 Dependabot 支持的生态，
#      依赖升级需手动在 DevEco Studio 中检查。
#      iOS 依赖由 Xcode 管理，同样不在 Dependabot 覆盖范围内。
